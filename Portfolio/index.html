    *, *::before, *::after {

    .scene-3d {
      perspective: 1200px;
      perspective-origin: 50% 45%;
    }

    .hero-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;
      height: 100svh;
      z-index: 45;
      overflow: hidden;
      transform-style: preserve-3d;
      will-change: transform, opacity;
      transition: 
        transform 1.15s cubic-bezier(0.8, 0, 0.1, 1),
        opacity 0.85s cubic-bezier(0.8, 0, 0.2, 1);
    }

    #hero-stage {
      transform-style: preserve-3d;
      will-change: transform;
    }

    #hero-portrait-container {
      will-change: transform, opacity;
      transition: transform 1.15s cubic-bezier(0.8, 0, 0.1, 1), opacity 0.8s ease;
    }

    #hero-name-wrapper {
      will-change: transform, opacity, letter-spacing;
      transition: transform 1.15s cubic-bezier(0.8, 0, 0.1, 1), opacity 0.75s ease, letter-spacing 1.15s ease;
    }

    #hero-talk-btn {
      will-change: transform, opacity;
      transition: transform 1.15s cubic-bezier(0.8, 0, 0.1, 1), opacity 0.75s ease;
    }

    #hero-ghost-text {
      will-change: transform, opacity;
      transition: transform 1.15s cubic-bezier(0.8, 0, 0.1, 1), opacity 0.75s ease;
    }

    .hero-container.dive-in {
      transform: translate3d(0, 0, 1100px);
      opacity: 0;
      pointer-events: none;
    }

    .hero-container.dive-in #hero-portrait-container {
      transform: scale(3.5) translateY(-30px);
      opacity: 0;
    }

    .hero-container.dive-in #hero-name-wrapper {
      transform: scale(3.8) translateY(140px);
      letter-spacing: 0.25em;
      opacity: 0;
    }

    .hero-container.dive-in #hero-talk-btn {
      transform: scale(2.5) translateY(-80px);
      opacity: 0;
    }

    .hero-container.dive-in #hero-ghost-text {
      transform: scale(4.2);
      opacity: 0;
    }

    #main-content {
      position: relative;
      z-index: 10;
      width: 100%;
      transform-origin: center 250px;
      will-change: transform, opacity;
      transition: 
        transform 1.15s cubic-bezier(0.16, 1, 0.3, 1),
        opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1);
    }

    body.hero-locked #main-content {
      transform: scale(0.82) translate3d(0, 0, -250px);
      opacity: 0;
      pointer-events: none;
    }

    body:not(.hero-locked) #main-content {
      transform: scale(1) translate3d(0, 0, 0);
      opacity: 1;
      pointer-events: auto;
    }

    .reg-cross {
      position: absolute;
      width: 14px;
      height: 14px;
      pointer-events: none;
      z-index: 25;
      opacity: 0.6;
    }
    .reg-cross::before {
      content: '';
      position: absolute;
      left: 6px;
      top: 0;
      width: 2px;
      height: 14px;
      background: #FFFFFF;
    }
    .reg-cross::after {
      content: '';
      position: absolute;
      left: 0;
      top: 6px;
      width: 14px;
      height: 2px;
      background: #FFFFFF;
    }

  <!-- INTERACTION ENGINE -->
  <script>
    lucide.createIcons();

    let isLandingFixed = true;
    let isTransitioning = false;

    document.addEventListener("DOMContentLoaded", () => {
      initHeroParallax();
      initMobileNav();
      initFixedLandingCamera();
    });

    // 3D CAMERA DIVE ZOOM MECHANICS
    function initFixedLandingCamera() {
      window.addEventListener("wheel", (e) => {
        if (isLandingFixed && e.deltaY > 15 && !isTransitioning) {
          triggerCameraZoom();
        }
      }, { passive: false });

      let touchStartY = 0;
      window.addEventListener("touchstart", (e) => {
        touchStartY = e.touches[0].clientY;
      }, { passive: true });

      window.addEventListener("touchend", (e) => {
        if (!isLandingFixed || isTransitioning) return;
        const touchEndY = e.changedTouches[0].clientY;
        if (touchStartY - touchEndY > 45) {
          triggerCameraZoom();
        }
      }, { passive: true });
    }

    function triggerCameraZoom() {
      if (isTransitioning) return;
      isTransitioning = true;
      const hero = document.getElementById("hero");

      hero.classList.add("dive-in");
      document.body.classList.remove("hero-locked");

      setTimeout(() => {
        window.location.href = "about.html";
      }, 1000);
    }

    function closeMobileMenu() {
      const drawer = document.getElementById("mobile-menu");
      if (drawer) {
        drawer.classList.add("opacity-0", "pointer-events-none");
        drawer.classList.remove("opacity-100", "pointer-events-auto");
      }
    }

    function initHeroParallax() {
      const hero = document.getElementById("hero");
      const portrait = document.getElementById("hero-portrait-container");
      const ghost = document.getElementById("hero-ghost-text");
      if (!hero || !portrait || !ghost) return;

      let mx = 0, my = 0, tx = 0, ty = 0;

      hero.addEventListener("mousemove", (e) => {
        const r = hero.getBoundingClientRect();
        tx = (e.clientX - r.left) / r.width - 0.5;
        ty = (e.clientY - r.top) / r.height - 0.5;
      });

      hero.addEventListener("mouseleave", () => {
        tx = 0;
        ty = 0;
      });

      function anim() {
        mx += (tx - mx) * 0.08;
        my += (ty - my) * 0.08;

        portrait.style.transform = `translate3d(${mx * 10}px, ${my * 6}px, 0)`;
        ghost.style.transform = `translate3d(${-mx * 15}px, ${-my * 8}px, 0)`;

        requestAnimationFrame(anim);
      }
      anim();
    }

    function initMobileNav() {
      const toggle = document.getElementById("menu-toggle");
      const drawer = document.getElementById("mobile-menu");
      if (!toggle || !drawer) return;

      let open = false;
      const setDrawer = (state) => {
        open = state;
        if (open) {
          drawer.classList.remove("opacity-0", "pointer-events-none");
          drawer.classList.add("opacity-100", "pointer-events-auto");
        } else {
          drawer.classList.add("opacity-0", "pointer-events-none");
          drawer.classList.remove("opacity-100", "pointer-events-auto");
        }
      };

      toggle.addEventListener("click", () => setDrawer(!open));
    }
  </script>
