<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Contact — SHIVANANDHA K K</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            heading: ['Sora', '"Plus Jakarta Sans"', 'sans-serif'],
            body: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            hero: {
              top: '#F97316',
              mid: '#9A3412',
              deep: '#8C2410',
            },
            jd: {
              periwinkle: '#747CD4',
              mint: '#B4E5D7',
              mintDark: '#2D8170',
              yellow: '#FFBE53',
              yellowDark: '#8A5D07',
              charcoal: '#38393D',
              coral: '#FA8268',
              canvas: '#F4F3EE',
              cardBg: '#FFFFFF',
              lavenderBg: '#F3F2F8',
              ink: '#151619'
            }
          },
          boxShadow: {
            'bento': '0 10px 30px -4px rgba(21, 22, 25, 0.05), 0 2px 8px -2px rgba(21, 22, 25, 0.03)',
            'bento-hover': '0 20px 35px -6px rgba(21, 22, 25, 0.09)',
            'node': '0 6px 18px -2px rgba(116, 124, 212, 0.2)',
            'node-active': '0 0 0 3px #747CD4, 0 10px 24px -4px rgba(116, 124, 212, 0.35)',
          }
        }
      }
    }
  </script>

  <style>
    *, *::before, *::after {
      font-stretch: 100% !important;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    html, body {
      background-color: #38393D;
      color: #151619;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    ::-webkit-scrollbar {
      display: none !important;
      width: 0px !important;
      height: 0px !important;
    }

    .window-page {
      height: 100vh;
      height: 100svh;
      width: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }

    .bento-shell {
      max-width: 1040px;
      margin-left: auto;
      margin-right: auto;
      padding-left: 1.25rem;
      padding-right: 1.25rem;
    }
    @media (min-width: 768px) {
      .bento-shell {
        padding-left: 2rem;
        padding-right: 2rem;
      }
    }
  </style>
</head>

<body class="selection:bg-jd-yellow selection:text-jd-charcoal">

  <!-- Top Minimal Floating Header -->

    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2 group">
        <span class="nav-logo text-xs font-mono font-bold tracking-widest text-white transition-colors duration-300">SHIVANANDHA</span>
      </a>

      <nav class="hidden md:flex items-center gap-7 text-[14px] font-semibold text-white/85 nav-links transition-colors duration-300">
        <a href="index.html" class="hover:opacity-80 transition-opacity">Home</a>
        <a href="about.html" class="hover:opacity-80 transition-opacity">About</a>
        <a href="skills.html" class="hover:opacity-80 transition-opacity">Techs & Tools</a>
        <a href="projects.html" class="hover:opacity-80 transition-opacity">Work</a>
        <a href="achievements.html" class="hover:opacity-80 transition-opacity">Achievements</a>
        <a href="contact.html" class="hover:opacity-80 transition-opacity text-jd-yellow font-bold">Contact</a>
      </nav>

      <div class="flex items-center gap-2">
        <a href="contact.html" class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-[12px] font-bold bg-white text-jd-charcoal shadow-sm hover:bg-jd-yellow transition-all">
          <span>Connect</span>
          <i data-lucide="arrow-up-right" class="w-3.5 h-3.5"></i>
        </a>
        <button id="menu-toggle" aria-label="Toggle Menu" class="p-1.5 rounded-lg text-white md:hidden bg-black/20 focus:outline-none">
          <i data-lucide="menu" class="w-5 h-5"></i>
        </button>

    </div>
  </header>

  <div id="mobile-menu" class="fixed inset-0 bg-jd-charcoal/95 backdrop-blur-md z-50 flex flex-col justify-center items-center gap-6 text-base font-bold text-white transition-all duration-300 opacity-0 pointer-events-none md:hidden">
    <a href="index.html" onclick="closeMobileMenu();" class="mobile-item hover:text-jd-yellow transition-colors">HOME</a>
    <a href="about.html" onclick="closeMobileMenu();" class="mobile-item hover:text-jd-yellow transition-colors">ABOUT</a>

    <a href="projects.html" onclick="closeMobileMenu();" class="mobile-item hover:text-jd-yellow transition-colors">SELECTED WORK</a>

  <main id="main-content">
    <!-- PAGE 6 — CONTACT -->
    <section id="contact" class="window-page bg-jd-charcoal text-white pt-16">
      <div class="bento-shell relative z-10 w-full">
        <div class="mb-6 max-w-lg">
          <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/10 text-jd-yellow text-[9px] font-mono uppercase tracking-wider font-bold mb-2">
            <span class="w-2 h-2 rounded-full bg-jd-yellow"></span>
            <span>DISPATCH // 06</span>
          </div>

          <h2 class="font-display font-extrabold text-2xl sm:text-4xl tracking-tight uppercase leading-tight mb-2">
            LET'S BUILD <br />
            <span class="text-transparent bg-clip-text bg-gradient-to-r from-jd-yellow via-jd-coral to-jd-mint">
              SOMETHING.
            </span>
          </h2>
          
          <p class="text-white/70 text-[12.5px] font-medium leading-relaxed">
            Available for software engineering roles, academic discussions, and collaborative web & data projects.
          </p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-5">
          <a 
            id="contact-gh-link" 
            href="https://github.com" 
            target="_blank" 
            rel="noopener noreferrer"
            class="bg-white/5 hover:bg-white/10 border border-white/10 rounded-[22px] p-5 transition-all duration-300 group flex flex-col justify-between"
          >
            <div class="flex justify-between items-center mb-4">
              <div class="w-8 h-8 rounded-lg bg-white/10 flex items-center justify-center text-white group-hover:bg-jd-yellow group-hover:text-jd-charcoal transition-colors">
                <i data-lucide="github" class="w-4 h-4"></i>
              </div>
              <i data-lucide="arrow-up-right" class="w-4 h
